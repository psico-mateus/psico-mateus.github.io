<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="color-scheme" content="light" />
    <meta
      http-equiv="refresh"
      content="0; url=https://area-do-paciente.psico-mateus.workers.dev/"
    />
    <link
      rel="canonical"
      href="https://area-do-paciente.psico-mateus.workers.dev/"
    />
    <title>Área do paciente | Mateus Ribeiro Marcos</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f3ed;
        color: #252423;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.25rem;
      }

      main {
        width: min(100%, 34rem);
        border: 1px solid #d9d1c6;
        border-radius: 1.5rem;
        background: #fffdfa;
        padding: clamp(1.5rem, 6vw, 3rem);
        box-shadow: 0 1.5rem 4rem rgb(45 39 31 / 9%);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2rem;
      }

      .brand img { width: 3rem; height: 3rem; }
      .brand strong { font-family: Georgia, "Times New Roman", serif; }

      .eyebrow {
        margin: 0 0 0.65rem;
        color: #7c5a22;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.15em;
      }

      h1 {
        margin: 0 0 1rem;
        font: 500 clamp(2.2rem, 9vw, 3.4rem) / 1.02 Georgia, "Times New Roman", serif;
        letter-spacing: -0.04em;
      }

      p { color: #69635d; line-height: 1.65; }

      .primary-link {
        min-height: 3rem;
        margin-top: 1.5rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: #252622;
        color: #fff;
        padding: 0.75rem 1.2rem;
        font-weight: 750;
        text-decoration: none;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.2rem;
        margin-top: 2rem;
        border-top: 1px solid #e4ddd4;
        padding-top: 1.25rem;
        font-size: 0.88rem;
      }

      nav a { color: #625d57; text-underline-offset: 0.2em; }

      a:focus-visible {
        outline: 3px solid #b8842d;
        outline-offset: 4px;
      }
    </style>
    <script>
      window.location.replace("https://area-do-paciente.psico-mateus.workers.dev/");
    </script>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/assets/images/logo-mateus.svg" alt="" width="48" height="48" />
        <strong>Mateus Ribeiro Marcos</strong>
      </div>
      <p class="eyebrow">ENDEREÇO ATUALIZADO</p>
      <h1>Área do paciente</h1>
      <p>
        Este endereço foi substituído. Você será levado para a Área do paciente,
        onde estão o acesso e os recursos atuais.
      </p>
      <a class="primary-link" href="https://area-do-paciente.psico-mateus.workers.dev/">
        Abrir a Área do paciente
      </a>
      <nav aria-label="Outros recursos">
        <a href="https://psico-mateus.github.io/">Site profissional</a>
        <a href="https://psico-mateus.github.io/guia-emocoes/">Guia de Emoções</a>
      </nav>
    </main>
  </body>
</html>
